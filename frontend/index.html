<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SarcasmSense — AI Sarcasm Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #13131a;
      --border:   #2a2a3a;
      --accent:   #e8ff47;
      --accent2:  #ff4776;
      --text:     #e8e8f0;
      --muted:    #6b6b80;
      --sarc:     #ff4776;
      --not:      #47ffa8;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.7s ease both;
    }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
      position: relative;
    }

    h1 span::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .subtitle {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    .input-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      display: block;
    }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem 1.1rem;
      resize: vertical;
      min-height: 130px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--accent); }

    .char-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
      margin-top: 0.4rem;
    }

    /* Examples */
    .examples {
      margin-top: 1rem;
    }

    .examples-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Button */
    button.analyze-btn {
      margin-top: 1.4rem;
      width: 100%;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    button.analyze-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    button.analyze-btn:active { transform: translateY(0); }
    button.analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-loader {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid #0a0a0f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .loading .btn-text  { display: none; }
    .loading .btn-loader { display: block; }

    /* Result */
    .result {
      margin-top: 1.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: none;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .result.show { display: block; }
    .result.sarcastic { border-color: var(--sarc); background: rgba(255,71,118,0.05); }
    .result.not       { border-color: var(--not);  background: rgba(71,255,168,0.05); }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .verdict {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .sarcastic .verdict { color: var(--sarc); }
    .not       .verdict { color: var(--not);  }

    

    /* Bar */
    .bars { display: flex; flex-direction: column; gap: 0.7rem; }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .bar-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      width: 110px;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0;
      transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
    }

    .bar-fill.sarc { background: var(--sarc); }
    .bar-fill.not  { background: var(--not);  }

    .bar-val {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--text);
      width: 44px;
      text-align: right;
    }

    /* Error */
    .error-msg {
      display: none;
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(255,71,118,0.08);
      border: 1px solid var(--sarc);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--sarc);
    }
    .error-msg.show { display: block; }

    /* Footer */
    footer {
      margin-top: 2rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      animation: fadeUp 0.7s 0.3s ease both;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">🧠 BERT · NLP · Deep Learning</div>
    <h1>Sarcasm<span>Sense</span></h1>
    <p class="subtitle">Fine-tuned BERT model that detects sarcasm in text</p>
  </header>

  <div class="card">
    <label class="input-label" for="textInput">Enter your text</label>
    <textarea id="textInput" placeholder="Type something… or try one of the examples below." maxlength="512"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 512</div>

    <div class="examples">
      <div class="examples-label">Try an example</div>
      <div class="example-chips" id="chips"></div>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
      <span class="btn-text">Analyze Text</span>
      <div class="btn-loader"></div>
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result" id="result">
      <div class="result-header">
        <div class="verdict" id="verdictText"></div>
        
      </div>
      <div class="bars">
        <div class="bar-row">
          <div class="bar-label">Sarcastic</div>
          <div class="bar-track"><div class="bar-fill sarc" id="barSarc"></div></div>
          <div class="bar-val" id="valSarc">—</div>
        </div>
        <div class="bar-row">
          <div class="bar-label">Not Sarcastic</div>
          <div class="bar-track"><div class="bar-fill not" id="barNot"></div></div>
          <div class="bar-val" id="valNot">—</div>
        </div>
      </div>
    </div>
  </div>

  <footer>Built with Fine-tuned BERT · News Headlines Dataset · Flask + Vanilla JS</footer>
</div>

<script>
  const EXAMPLES = [
    "Oh great, another Monday. Just what I needed.",
    "The weather is absolutely perfect for staying indoors.",
    "Scientists discover water on Mars.",
    "Yeah, because getting stuck in traffic is my favourite hobby.",
    "The team won the championship last night.",
    "Sure, I totally love working overtime every weekend.",
  ];

  // Render chips
  const chipsEl = document.getElementById('chips');
  EXAMPLES.forEach(ex => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = ex.length > 45 ? ex.slice(0, 44) + '…' : ex;
    chip.title = ex;
    chip.onclick = () => {
      document.getElementById('textInput').value = ex;
      updateCount();
      hideResult();
    };
    chipsEl.appendChild(chip);
  });

  // Char counter
  const ta = document.getElementById('textInput');
  const cc = document.getElementById('charCount');
  function updateCount() { cc.textContent = ta.value.length; }
  ta.addEventListener('input', updateCount);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) analyze();
  });

  function hideResult() {
    document.getElementById('result').classList.remove('show','sarcastic','not');
    document.getElementById('errorMsg').classList.remove('show');
  }

  async function analyze() {
    const text = ta.value.trim();
    if (!text) { showError("Please enter some text first."); return; }

    hideResult();
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res  = await fetch('/analyze', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ text }),
      });
      const data = await res.json();

      if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }

      showResult(data);
    } catch (err) {
      showError('Could not reach the server. Is app.py running?');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showResult(data) {
    const resultEl = document.getElementById('result');
    const isSarc   = data.label === 'Sarcastic';

    document.getElementById('verdictText').textContent  = data.label;
    
    document.getElementById('valSarc').textContent      = data.prob_sarcastic + '%';
    document.getElementById('valNot').textContent       = data.prob_not + '%';

    resultEl.className = 'result';
    resultEl.classList.add('show', isSarc ? 'sarcastic' : 'not');

    // Animate bars after paint
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById('barSarc').style.width = data.prob_sarcastic + '%';
        document.getElementById('barNot').style.width  = data.prob_not + '%';
      }, 50);
    });
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }
</script>
</body>
</html>
